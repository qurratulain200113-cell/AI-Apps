<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
  </defs>
  <!-- Background with rounded squircle safe for maskable padding -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  <!-- Inner circular badge ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="24" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="24" stroke-dasharray="840 1200" stroke-linecap="round" />
  <!-- Center Emblem -->
  <g transform="translate(156, 156)">
    <!-- Shield / Metrics icon -->
    <path d="M100 20 L180 50 L180 120 C180 170 145 200 100 215 C55 200 20 170 20 120 L20 50 Z" fill="#ffffff" opacity="0.95" />
    <!-- Checkmark & Graph lines -->
    <path d="M70 115 L92 138 L135 90" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
